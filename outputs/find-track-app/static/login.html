<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Find&Track</title><link rel="stylesheet" href="/styles.css"><script src="/login.js" defer></script></head><body><main class="settings" style="max-width:440px;margin:8vh auto;padding:24px"><div class="brand"><span class="mark">f.</span>find&track</div><section class="panel" style="margin-top:28px"><h1 style="font-size:26px">Your private workspace.</h1><p class="muted" style="margin:12px 0 24px">Sign in with the email registered for this workspace.</p><form id="sign-in"><label>Email<input id="email" name="email" type="email" autocomplete="email" required></label><button class="button primary" type="submit" style="margin-top:16px">Send sign-in code</button></form><form id="verify-code" hidden><label>Sign-in code<input name="code" id="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6,10}" maxlength="10" required></label><p class="small muted" style="margin:12px 0">Check your email for the code.</p><button class="button primary" type="submit">Open workspace</button><button class="button ghost" type="button" id="different-email">Use another email</button></form><p id="message" role="status" aria-live="polite" style="margin-top:18px"></p></section></main></body></html>
